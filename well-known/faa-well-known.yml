summary: >-
  No /.well-known/ discovery document is published on any FAA host. Absence is
  valid data. IMPORTANT CAVEAT for re-runs: api.faa.gov 301-redirects every path
  to portal.apic4e.faa.gov, a Gravitee developer-portal single-page application
  that answers HTTP 200 with an Angular HTML shell for ANY path — so a naive
