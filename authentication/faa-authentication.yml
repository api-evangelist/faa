onboarding:
  portal: https://api.faa.gov/
  portal_actual: https://portal.apic4e.faa.gov/ (301 from api.faa.gov)
  software: Gravitee.io APIM Developer Portal
  self_serve: true
  evidence: >-
    Portal configuration reports userCreation.enabled=true and
    applicationCreation.enabled=true. The FAA Data Portal says verbatim: "Developers
    can easily integrate FAA dataset into software applications thanks to the FAA's
    Application Programming Interfaces (APIs). Get started by creating an API key".
  approval: >-
    Every API_KEY plan in the portal is validation MANUAL — an account is self-serve
    but a subscription is approved by the FAA API owner. The Air Carrier PRD plan
    additionally sets comment_required, so a justification must be supplied.
  out_of_band:
  - api: FAA NOTAM Management Service (NMS)
    method: email request to notams@faa.gov
    source: https://nms.aim.faa.gov/
    verbatim: 'Please contact us at notams@faa.gov to request access to the new NMS-API.'
  - api: SWIM / SWIM Cloud Distribution Service
    method: executed FAA SWIM agreement via the SWIFT Portal
    source: https://portal.swim.faa.gov/
  - api: SWIM CDM, TFMS Request/Reply, TFMS International Data Provider
    method: email request to Data-To-Industry@faa.gov, reviewed in accordance with FAA policy
  - api: LAANC
    method: only through an FAA-Approved UAS Service Supplier, never directly
