- name: client_id + client_secret
  type: apiKey
  in: header
  parameter: client_id, client_secret
  declared_as: required header parameters on every operation, NOT a securityScheme
  sources: [openapi/faa-air-carrier-prd-api-openapi.yml]
  applies_to:
  - FAA Air Carrier PRD API
  - FAA NOTAM API
  evidence: >-
    All eight PRD operations declare both as `required: true` header parameters. An
    unauthenticated GET to https://external-api.faa.gov/notamapi/v1/notams returned
    HTTP 401 {"message":"Unauthorized","http_status_code":401} on 2026-07-28.
  weakness: >-
    A client SECRET carried as a plain request header with no token exchange, no
    expiry and no rotation policy — and modelled as a parameter, so generated clients
    and API tooling do not recognise the API as authenticated at all. This guards the
    most sensitive data in the FAA estate (pilot employment, training, drug/alcohol
    and disciplinary records).
