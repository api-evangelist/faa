docs: https://www.faa.gov/data
upgrades: >-
  Upgrades the 2026-07-28 derived pass, which saw only the two apiKey schemes in the
  SAS spec. The FAA's real credential model is wider than its securitySchemes: two
  APIs need no credential at all, one declares its credential as ordinary header
  PARAMETERS rather than a scheme, and the gateway itself has a key header that
  appears in no spec.
summary:
  types: [none, apiKey]
  api_key_in: [header]
  oauth2_flows: []
  oauth2: false
  oidc: false
  mtls: false
  key_issuance: self-serve account and application creation, then MANUAL approval per API
  headline: >-
    No OAuth 2.0 and no OpenID Connect anywhere in the FAA public API estate. Every
    credentialed FAA API is a static shared secret carried in a request header, with
    no token exchange, no expiry, no rotation policy and no scopes. Two APIs — the
    two most useful ones — need no credential at all.
schemes:
- name: none
  type: none
  applies_to:
  - FAA Airport Status Web Service (ASWS)
  - FAA Aeronautic Product Release API (APRA)
  - FAA NAS Status airport status information feed
  - FAA Temporary Flight Restriction (TFR) list API
  - FAA NMS North Atlantic Track NOTAM feed
  - FAA NMS system metrics feed
  - FAA Data Catalog (CKAN)
  - FAA AIS and UDDS ArcGIS Open Data hubs
  - Releasable aircraft registry bulk ZIP
  evidence: >-
    Neither the ASWS nor the APRA OpenAPI declares components.securitySchemes, both
    declare a Creative Commons Zero (CC0) licence, and the FAA's own Gravitee plan
    for each is KEY_LESS. Unauthenticated HTTP 200 verified on both, and on the TFR,
    NAS status and NMS feeds, on 2026-07-28.
