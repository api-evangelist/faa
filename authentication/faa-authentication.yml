gaps:
- No OAuth 2.0 / OIDC anywhere, so no delegated access and no consent model.
- No scopes, so no least-privilege credential for any FAA API.
- No documented key rotation, expiry or revocation policy.
- The PRD credential is modelled as a parameter, not a security scheme.
- The SAS security schemes are defined but never applied.
- The gateway key header appears in no published spec.
