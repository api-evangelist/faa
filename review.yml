aid: faa
name: Federal Aviation Administration
review:
  question: >-
    What would it cost a consumer of Federal Aviation Administration data or APIs
    to leave, and what does a developer actually have to sign to get in?
  date: '2026-07-28'
  reviewer: API Evangelist
  sector: Travel & Aviation
  tier: regulator
  homeMarket: United States
  method: >-
    Live HTTP probing of faa.gov and its subdomains plus harvest of the public
    Gravitee developer portal catalog API. Every URL below records the HTTP status
    observed on 2026-07-28. No endpoint, spec, host or scope in this file was
    inferred; each was either fetched or explicitly recorded as unreachable.

findings:
  summary: |
    The FAA is not a distribution participant. It sells no inventory, is not a GDS,
    is not an NDC party, and has no channel-manager or OTA relationship. It is the
    upstream source of the aeronautical facts that the entire US travel chain
    depends on, so the switching-cost question inverts: nobody can leave the FAA,
    because there is no second US civil aviation authority — but the FAA imposes
    almost no contractual friction on the data it does publish openly.

    The public surface is real and better than most regulators. api.faa.gov
    redirects (HTTP 301) to a Gravitee APIM developer portal at
    portal.apic4e.faa.gov (HTTP 200) whose portal catalog API is itself
    unauthenticated and returns seven public API records. Four of those carry
    attached OpenAPI documents, all four of which were harvested verbatim and all
    four of which parse. Two of the APIs — the Airport Status Web Service and the
    Aeronautic Product Release API — answer unauthenticated with real data, and the
    ASWS OpenAPI declares a Creative Commons Zero (CC0) licence in
    info.license. Beyond the portal the FAA runs a CKAN 2.11.4 catalog, two ArcGIS
    Open Data hubs with DCAT-US 1.1 feeds and full bulk export, a 73 MB releasable
    aircraft registry ZIP, and unauthenticated JSON/XML feeds for TFRs and national
    airspace status.

    The gated half is equally real. The NOTAM API returns a structured HTTP 401 on
    an unauthenticated GET, the Air Carrier PRD API requires client_id and
    client_secret headers and is restricted by regulation to specific operator
    classes, and SWIM requires an executed agreement. And in one place the FAA
    deliberately runs an intermediated model that rhymes with the GDS structure:
    LAANC drone airspace authorization is only obtainable through FAA-Approved UAS
    Service Suppliers, never directly from the agency.

  probes:
    - url: https://api.faa.gov/
      status: 301
      redirectsTo: https://portal.apic4e.faa.gov/
      note: Official FAA developer portal. Gravitee.io APIM portal (Apache-2.0 header in served HTML).
    - url: https://portal.apic4e.faa.gov/
      status: 200
      note: Angular SPA portal shell. Returns 200 for arbitrary paths, so SPA 200s are not treated as evidence.
    - url: https://apim-api.apic4e.faa.gov/portal/environments/DEFAULT/apis?page=1&size=200
      status: 200
      note: Unauthenticated Gravitee portal catalog API. 7 public API records returned.
    - url: https://apim-api.apic4e.faa.gov/portal/environments/DEFAULT/configuration
      status: 200
      note: >-
        Portal config confirms userCreation.enabled=true and
        applicationCreation.enabled=true — self-serve developer signup and API key
        issuance. apikeyHeader is X-Gravitee-Api-Key.
    - url: https://apim-api.apic4e.faa.gov/portal/environments/DEFAULT/apis/categories
      status: 200
      note: Single category "Public" — "Publicly available APIs", total_apis 2.
    - url: https://external-api.faa.gov/asws/api/airport/delays
      status: 200
      note: Unauthenticated. Real JSON ground delay / ground stop payload keyed on IATA codes.
    - url: https://external-api.faa.gov/asws/api/airport/status/ATL
      status: 200
      note: Unauthenticated.
    - url: https://external-api.faa.gov/apra/vfr/sectional/info?edition=current&format=json&geoname=Seattle
      status: 200
      note: Unauthenticated. XML in FAA-proprietary namespace http://arpa.ait.faa.gov/arpa_response.
    - url: https://external-api.faa.gov/apra/nfdc/nasr/info?edition=current
      status: 200
      note: NASR 28-day subscription edition 7, edition date 07/09/2026.
    - url: https://external-api.faa.gov/notamapi/v1/notams
      status: 401
      note: >-
        Body {"message":"Unauthorized","http_status_code":401}. The bare host
        https://external-api.faa.gov/ returns 404, so the 401 confirms the route
        exists behind credentials. No public OpenAPI attached in the portal catalog.
    - url: https://external-api.faa.gov/
      status: 404
      note: Control probe establishing that 401s on this host are route-specific.
    - url: https://nasstatus.faa.gov/api/airport-status-information
      status: 200
      note: Unauthenticated XML feed. Real ground stop and ground delay program data.
    - url: https://tfr.faa.gov/tfrapi/exportTfrList
      status: 200
      note: Unauthenticated application/json, 28,701 bytes. NOTAM ids, ARTCC facility ids, states.
    - url: https://catalog.data.faa.gov/api/3/action/status_show
      status: 200
      note: 'CKAN 2.11.4, site_title "Federal Aviation Administration".'
    - url: https://catalog.data.faa.gov/api/3/action/package_list
      status: 200
      note: 6 datasets, all aeronautical chart products.
    - url: https://catalog.data.faa.gov/data.json
