switchingCost:
  interfaceShape:
    value: standard-plus-proprietary
    standardsNamed:
      - name: OpenAPI
        version: 3.0.0 / 3.0.1
        where: All four harvested FAA specs.
      - name: FIXM (Flight Information Exchange Model)
        version: not stated on the public SWIM pages
        where: SWIM SFDPS and STDDS, per faa.gov/air_traffic/technology/swim/sfdps and /stdds.
      - name: AIXM (Aeronautical Information Exchange Model)
        version: not stated on the public SWIM pages
        where: SWIM SFDPS transformation output.
      - name: DCAT-US
        version: '1.1'
        where: catalog.data.faa.gov/data.json, ais-faa.opendata.arcgis.com/data.json, udds-faa.opendata.arcgis.com.
      - name: CKAN Action API
        version: CKAN 2.11.4
        where: catalog.data.faa.gov/api/3/action.
      - name: Esri ArcGIS GeoServices REST
        version: not stated
        where: services6.arcgis.com/ssFJjBXIUyZDrSYZ, both FAA open data hubs.
      - name: Java Message Service (JMS) over Solace
        version: n/a
        where: SWIM Cloud Distribution Service, governed by FAA-STD-073A.
      - name: GeoJSON / KML / CSV / Shapefile
        version: n/a
        where: ArcGIS hub bulk download distributions.
    proprietaryElements:
      - >-
        APRA responses use the FAA-only XML namespace
        http://arpa.ait.faa.gov/arpa_response — a shape no other party implements.
      - >-
        ASWS, PRD, SAS and DMS are FAA-designed REST resource shapes. They are
        documented in OpenAPI, but no second implementer exists.
      - >-
        FAA-STD-065B / FAA-STD-073A / FAA-STD-074 / SWIM-002 are FAA-authored
        service description standards, not industry ones.
    reasoning: >-
      Where the FAA touches international aviation information exchange it uses the
      ICAO-lineage open models (FIXM, AIXM) and generic government open-data
      standards (DCAT-US, CKAN, ArcGIS/GeoJSON). Where it publishes its own product
      APIs it uses proprietary resource shapes described with an open specification
      language. Documented in a standard, not standardised.

  secondSource:
    value: no-alternative
    reasoning: >-
      There is exactly one civil aviation authority for the United States. NOTAMs,
      TFRs, the NASR 28-day subscription, terminal procedures, N-Number registration,
      airman certification, the Pilot Records Database and LAANC authorization have
      no lawful substitute source. Every commercial provider of this data is a
      redistributor of FAA output.
    alternativesConsidered:
      - name: NOAA Aviation Weather Center (aviationweather.gov)
        verdict: >-
          Different US agency, adjacent data only (METAR/TAF/PIREP). Verified live
          (HTTP 200 on /api/data/metar?ids=KATL) but does not substitute for any
          FAA product.
      - name: EUROCONTROL EAD / EASA
        verdict: European AIS. Not a substitute for US airspace or US registry data.
      - name: Jeppesen, ForeFlight, Garmin, Lido, NavBlue
        verdict: >-
          Commercial chart and nav-data vendors. Genuine alternatives to each other
          for packaging and delivery, but all derive from FAA source data. Switching
          between them is a project; switching away from the FAA is impossible.
      - name: FlightAware, Flightradar24, Cirium, OAG
        verdict: >-
          Flight-tracking and schedule aggregators. Alternatives to each other for
          derived flight status, and they blend ADS-B and airline feeds, but the
          regulatory layer still traces to the FAA.
      - name: Aloft, Avision, UASidekick and other FAA-Approved USS
        verdict: >-
          Interchangeable with one another for LAANC submission — the FAA approves
          multiple suppliers on the same authorization pathway — but the pathway
          itself has no alternative.

  exitPath:
    value: bulk-export-documented
    operationsCited:
      - 'GET https://external-api.faa.gov/apra/nfdc/nasr/chart — NASR 28-day subscription ZIP (edition endpoint verified 200, edition 7, 07/09/2026).'
      - 'GET https://external-api.faa.gov/apra/{product}/chart — 17 chart product families, each with a bulk download operation.'
      - 'https://registry.faa.gov/database/ReleasableAircraft.zip — 200, 72,996,601 bytes, full releasable aircraft registry.'
      - 'https://catalog.data.faa.gov/api/3/action/package_list and /data.json — CKAN + DCAT-US 1.1 whole-catalog enumeration.'
      - 'https://ais-faa.opendata.arcgis.com/api/download/v1/items/{id}/csv?layers=0 — per-dataset bulk CSV; GeoJSON, KML, ZIP shapefile also offered on 73 AIS and 28 UAS datasets.'
    caveat: >-
      Export is comprehensive for published reference data. It is not a
      data-portability right over an account's own records — a Part 121 operator
      that has submitted pilot records into PRD has no documented bulk retrieval
      of its own submissions; the PRD API's search operations are per-request, not
      an export. No GDPR-style portability commitment applies; the applicable
      regime is the Privacy Act and FOIA, and the FAA publishes a FOIA electronic
      reading room (https://www.faa.gov/foia/electronic_reading_room, HTTP 200)
      rather than a self-service export.

  identifierPortability:
    summary: >-
      Overwhelmingly shared industry identifiers — the FAA is an issuer of them, not
      a holder of private keys.
    identifiersFound:
      - 'IATA three-letter airport codes — ASWS path parameter airportCode; NAS status feed ARPT elements (ATL, EWR, JFK, LGA, SFO).'
      - 'ICAO four-letter location indicators — NOTAM API icaoLocation parameter (KATL probed).'
      - 'US aircraft registration marks (N-Numbers) — registry.faa.gov aircraft inquiry and the releasable registry ZIP.'
      - 'FAA airman certificate numbers — the join key for the Pilot Records Database.'
      - 'NOTAM identifiers — e.g. 6/9404, 6/9403 observed live in the TFR list API.'
      - 'ARTCC facility identifiers — ZSE, ZLC observed live in the TFR list API.'
      - 'Chart geonames and edition numbers — APRA (geoname "Seattle", editionNumber 97).'
      - 'GUFI (Globally Unique Flight Identifier) — generated by SWIM SFDPS, an ICAO-aligned flight key.'
      - 'FAA Designee Numbers and ODA Key IDs — DMS lookup keys; these are FAA-proprietary and do not travel.'
      - 'ArcGIS item IDs — hub-internal opaque keys on open data downloads; incidental, not the data model.'
    verdict: >-
      A consumer's integration is keyed on identifiers that every other aviation
      system already understands. Rebuilding against a different source would fail
      on availability of the data, not on translating the keys.

  contractualLockIn:
    value: essentially none published for the open products; eligibility restrictions and an agreement for the gated ones
    verbatim:
      - source: openapi/faa-airport-status-web-service-openapi.yml (info.license)
        text: 'Creative Commons 0 (CC0) — https://creativecommons.org/publicdomain/zero/1.0/legalcode'
      - source: api.faa.gov portal catalog record for Air Carrier PRD API
        text: >-
          "This API enables data submission to the Pilot Records Database (PRD).
          Access is restricted to operators under Part 121, 135, 125, 91K, Air Tour,
          Public Aircraft, or 91 Corporate. Requests for access from any other public
          or private entities will not be authorized."
      - source: https://www.faa.gov/data
        text: '"Request access to SWIM via the Agreement Portal."'
      - source: https://www.faa.gov/air_traffic/technology/swim/products/get_connected
        text: >-
          "To access the following services, please submit your request to
          Data-To-Industry@faa.gov: Collaborative Decision Making (CDM) Data
          Elements... TFMS Request/Reply, TFMS International Data Provider. Your
          request will be reviewed in accordance with FAA policy."
      - source: https://www.faa.gov/uas/programs_partnerships/data_exchange
        text: '"Companies approved to provide LAANC Services are known as FAA Approved UAS Service Suppliers (USS)."'
    notPublished:
      - No minimum term found.
      - No exclusivity clause found.
      - No termination notice period found.
      - No per-transaction or per-segment fee found on any probed API.
      - No published revocation-on-account-closure policy for the developer portal.
    verdict: >-
      The commercial cost of leaving is zero. The regulatory cost of leaving is
      absolute — a certificated operator cannot decline to use the PRD API, and a
      drone operator cannot decline LAANC. Lock-in here is statutory, not contractual.

  accessGate:
    value: self-serve
    perSurface:
      - surface: Airport Status Web Service (ASWS)
        gate: none — unauthenticated HTTP 200 verified
      - surface: Aeronautic Product Release API (APRA)
        gate: none — unauthenticated HTTP 200 verified
      - surface: NAS Status feed, TFR list API
        gate: none — unauthenticated HTTP 200 verified
      - surface: CKAN catalog, AIS and UDDS ArcGIS open data hubs, releasable registry ZIP
        gate: none — unauthenticated HTTP 200 verified
      - surface: NOTAM API
        gate: >-
          self-serve API key from api.faa.gov — portal permits user and application
          creation without approval; unauthenticated call returns 401
      - surface: Air Carrier PRD API
        gate: >-
          accredited-or-licensed — restricted by 14 CFR operating certificate class
          (Part 121, 135, 125, 91K, Air Tour, Public Aircraft, 91 Corporate)
      - surface: SWIM / SCDS
        gate: commercial-agreement — executed SWIM agreement via the Agreement Portal
      - surface: LAANC
        gate: partner-only — FAA-Approved UAS Service Supplier onboarding
    whatADeveloperMustSign: >-
      For the open products, nothing at all. For a portal API key, a Gravitee account
      and application registration on api.faa.gov, with no published agreement text.
      For PRD, proof of an FAA operating certificate in an eligible class. For SWIM,
      an executed FAA SWIM agreement. For LAANC, FAA USS approval.

  distributionModel:
    value: not-applicable
    reasoning: >-
      The FAA is a regulator and air navigation service provider. It does not
      distribute, resell or intermediate travel inventory. It has no GDS
      relationship, no channel manager, no OTA presence, and issues no fares.
    ndcPosture: >-
      Not applicable. IATA NDC governs airline offer and order distribution; the FAA
      has no role in it. Consumer disclosure and ticketing rules in the United States
      sit with the Department of Transportation (14 CFR Parts 250, 259, 399), not the
      FAA. No NDC reference of any kind was found anywhere on faa.gov during this
      review.
    regulatoryCounterweight: >-
      The FAA's distribution-shaped mandates run the other direction — it compels
      industry to publish INTO the agency rather than governing how industry sells.
      14 CFR Part 111 forces air carriers to submit and query pilot records through
      the Air Carrier PRD API; the SAS API takes passenger discrepancy reports; Remote
      ID forces drone broadcast. The one place the FAA reproduces an intermediation
      structure is LAANC, where drone operators cannot obtain airspace authorization
      directly and must transact through an approved USS — a mandated middle layer
      that is structurally the same idea as a GDS, but with the intermediaries
      approved, unpaid by the agency, and mutually interchangeable.

