  portal:
    url: https://api.faa.gov/
    confirmed: true
    software: Gravitee.io APIM Developer Portal
    selfServe: true
    evidence: >-
      Portal configuration endpoint reports userCreation.enabled=true and
      applicationCreation.enabled=true; the FAA Data Portal page instructs
      developers to "Get started by creating an API key". Two of the catalogued
      APIs additionally need no key at all.
    publicApisListed: 7
    publicApisWithOpenAPI: 4
    excludedFromApisYml:
      - name: demosub
        reason: Obvious internal demo artifact. Internal entrypoint only, no description, no spec.
      - name: Data Set API
        reason: Entrypoint internal-api.faa.gov only, no description, no attached specification.

