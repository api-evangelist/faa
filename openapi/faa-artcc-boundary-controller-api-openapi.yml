openapi: 3.2.0
info:
  title: Faa Artcc Boundary Controller API
servers:
- url: https://nasstatus.faa.gov
  description: Generated server url
tags:
- name: artcc-boundary-controller
paths:
  /api/artcc-boundaries:
    get:
      tags:
      - artcc-boundary-controller
      operationId: getAirportEvent
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtccBoundary'
      summary: Get airport event
      x-summary-source: derived
components:
  schemas:
    ArtccBoundary:
      type: object
      properties:
        name:
          type: string
        points:
          type: array
          items:
            $ref: '#/components/schemas/Point'
    Point:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
