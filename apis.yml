aid: faa
url: https://raw.githubusercontent.com/api-evangelist/faa/refs/heads/main/apis.yml
name: Federal Aviation Administration
kind: company
description: The Federal Aviation Administration (FAA) is the United States civil aviation
  authority, an operating administration of the U.S. Department of Transportation. It
  regulates and certificates aircraft, airmen, airports and air carriers, operates the
  National Airspace System and its air traffic control, and issues the aeronautical
  information the entire U.S. travel and aviation chain runs on — NOTAMs, TFRs, charts,
  the 28-day NASR subscription, aircraft registration and airport data. It sits upstream
  of commercial travel distribution rather than inside it — the FAA sells no inventory
  and is not a GDS, NDC or channel participant, but every airline, GDS, OTA, flight-planning
  app and drone service supplier in the United States consumes FAA data as a source of
  truth. Its API posture is genuinely mixed and honest reporting requires saying so. The
  Airport Status Web Service and the Aeronautic Product Release API are published under a
  Creative Commons Zero licence, answer unauthenticated over HTTPS, and ship real OpenAPI
  3.0.1 documents through a public Gravitee developer portal at api.faa.gov. Alongside
  them the FAA runs a CKAN 2.11.4 catalog and two ArcGIS Open Data hubs with DCAT-US 1.1
  feeds and bulk CSV/GeoJSON/KML export. But the NOTAM API, the Air Carrier Pilot Records
  Database API and SWIM are gated — client_id/client_secret headers, operator eligibility
  restricted by regulation, or an executed SWIM agreement — and LAANC drone authorization
  is reachable only through FAA-approved UAS Service Suppliers, never directly.
image: https://www.faa.gov/themes/custom/faa/favicon.png
tags:
- Travel
- United States
- Aviation
- Airports
- Government
- Regulator
- Open Data
