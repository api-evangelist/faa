apis:
- aid: faa:faa-notam-api
  name: FAA NOTAM API
  description: >-
    Notices to Air Missions retrieval API. Probe-confirmed live but gated — an unauthenticated GET returned
    HTTP 401 with the body {"message":"Unauthorized", "http_status_code":401} on 2026-07-28, while the
    bare external-api.faa.gov host returns 404, so the route exists behind credentials. Access is via
    a client_id and client_secret issued from the api.faa.gov developer portal. No public OpenAPI was
    published for this API in the portal's public catalog, so none was harvested — and the API does not
    appear in that catalog at all, so it has no published plan. Re-verified 401 on 2026-07-28. This surface
    sits on the legacy side of the FAA's NOTAM modernization; see the NOTAM Management Service (NMS) entry.
  humanURL: https://api.faa.gov/
  baseURL: https://external-api.faa.gov/notamapi/v1
  tags:
  - NOTAM
  - Flight Information
  - Airspace
  - Aviation
  properties:
  - type: Documentation
    url: https://api.faa.gov/
  - type: Website
    url: https://notams.aim.faa.gov/notamSearch/
  - type: Deprecation
    name: NOTAM modernization — USNS and FNS retiring in favour of NMS
    url: https://nms.aim.faa.gov/
- aid: faa:faa-nms-api
  name: FAA NOTAM Management Service (NMS) API
  description: >-
    The distribution interface of the FAA's new NOTAM Management Service, the vendor-provided replacement
    for the legacy United States NOTAM System (USNS) and Federal NOTAM System (FNS). Discovered and verified
    live 2026-07-28 at nms.aim.faa.gov, an FAA-operated portal publishing system metrics, a transition
    FAQ and an API access request path. Access is not self-serve — the portal states verbatim "Please
    contact us at notams@faa.gov to request access to the new NMS-API." No OpenAPI, schema or endpoint
    documentation is published to unauthenticated visitors, so none was harvested. The portal's own metrics
    report 261 onboarded API users and roughly 338,000 API calls per day.
  humanURL: https://nms.aim.faa.gov/
  tags:
  - NOTAM
  - Flight Information
  - Airspace
  - Aviation
  - Aeronautical Information
  properties:
  - type: Documentation
    url: https://nms.aim.faa.gov/
  - type: SignUp
    name: Request API access (notams@faa.gov)
    url: https://nms.aim.faa.gov/#api-access
  - type: StatusPage
    name: NMS system metrics
    url: https://nms.aim.faa.gov/#system-metrics
  - type: Deprecation
    name: USNS and FNS retirement and NMS transition schedule
    url: https://nms.aim.faa.gov/
- aid: faa:faa-nms-nat-track-feed
  name: FAA NMS North Atlantic Track NOTAM Feed
  description: >-
    Unauthenticated JSON feed of North Atlantic Track NOTAMs published by the FAA NOTAM Management Service.
    Each record carries accountability and origin ids, the formatted NOTAM number, ICAO id, location code,
    the full condition message text, start and end datetimes, classification code and transaction type
    (NAT_TRACK). Verified live 2026-07-28 (HTTP 200, application/json, real NAT track NOTAM data originated
    by CZQX). No OpenAPI is published for it.
  humanURL: https://nms.aim.faa.gov/
  baseURL: https://nms.aim.faa.gov/datanat/nat.json
  tags:
  - NOTAM
  - Airspace
  - Oceanic
  - Open Data
  - Flight Information
  properties:
  - type: Documentation
    url: https://nms.aim.faa.gov/
  - type: Website
    url: https://nms.aim.faa.gov/
- aid: faa:faa-nms-metrics-feed
  name: FAA NMS System Metrics Feed
  description: >-
    Unauthenticated JSON feed backing the NOTAM Management Service system metrics dashboard — cumulative
    NOTAMs processed, NMS API onboarded users, NMS API volume of data pulled per day, number of API calls
    per day, volume of NOTAMs processed per day and active NOTAMs, each with a period, direction and percentage
    trend, plus an updatedOn timestamp. This is the only published operational-health signal for any FAA
    API. Verified live 2026-07-28 (HTTP 200).
  humanURL: https://nms.aim.faa.gov/
  baseURL: https://nms.aim.faa.gov/data/content.json
  tags:
  - Metrics
