summary: >-
  The FAA conforms to the open specification LANGUAGES (OpenAPI 3.0.x) and to the
  government open-data standards (DCAT-US 1.1, CKAN Action API, Esri GeoServices
  REST, GeoJSON/KML) but not to the modern HTTP API conventions — no OAuth 2.0, no
  OpenID Connect, no RFC 9457 problem details, no RFC 9116 security.txt, no RFC 8594
  sunset headers, no idempotency, no standard pagination. Where the FAA touches
  international aviation information exchange it uses the ICAO-lineage models (AIXM,
  FIXM) through SWIM. Its own product APIs are FAA-proprietary resource shapes
  DOCUMENTED in a standard, not STANDARDISED.
