proprietary_shapes:
- >-
  APRA responses use the FAA-only XML namespace
  http://arpa.ait.faa.gov/arpa_response — a shape no other party implements.
- >-
  ASWS, PRD, SAS and DMS are FAA-designed REST resource shapes, documented in
  OpenAPI but with no second implementer.
