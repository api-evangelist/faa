format: none
format_note: >-
  The FAA publishes no RFC 9457 application/problem+json error contract. Every
  harvested OpenAPI declares its error responses as bare status codes with a
  human-readable description and `content: {}` — no error schema, no error media
  type, no machine-readable error code. The single observed error envelope on the
  wire is the API gateway's own JSON shape (see envelopes below), not a documented
  per-API contract. No FAA error-reference documentation page was found.
