    Requested edition has not been released for download or could not be found on
    the FAA aeronav web site.
  media_type: none declared
  applies_to: Aeronautic Product Release API
  remediation: >-
    Charts publish on the 28-day airspace cycle. `edition=next` returns 404 until
    the next edition is staged for release; call the matching /info operation first
    and only download once an edition is published.
