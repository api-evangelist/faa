  method: searched
  example: '{"message":"Unauthorized","http_status_code":401}'
  fields:
  - name: message
    description: Human-readable failure reason emitted by the gateway.
  - name: http_status_code
    description: HTTP status repeated in the body.
  note: >-
    Emitted by the gateway before the request reaches a backing API, so it applies
    to any credentialed FAA API called without or with bad credentials. It is not
    declared in any harvested OpenAPI.
- surface: Aeronautic Product Release API (APRA)
  media_type: application/xml
  note: >-
    APRA success responses use the FAA-proprietary XML namespace
    http://arpa.ait.faa.gov/arpa_response. The OpenAPI declares no content schema
    for any 4xx/5xx, so the error body shape is undocumented.
- surface: FAA Safety Assurance System (SAS) API
  media_type: application/json
  note: >-
    SAS returns errors in-band on a 200 response. The declared response object
    carries `errorMessage` and `discrepanciesImportedWithErrors` string fields
    alongside `confirmationMessage`, so partial failure is signalled in the payload
    rather than by status code.
