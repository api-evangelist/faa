summary: >-
  The FAA publishes no client SDK for its HTTP APIs (ASWS, APRA, NOTAM, PRD, SAS)
  — those are consumed directly over HTTPS and, for the CC0 ones, without any
  credential. The FAA's only first-party client libraries live in the faa-swim
  GitHub organization and target the SWIM message-broker surface, not the REST
  APIs: Java JMS clients and JAXB bindings for the AIXM 5.1 and FNS NOTAM feeds.
  They are published as source with Maven coordinates under the us.dot.faa.swim.*
  groupId in each pom.xml, but no matching artifact was found on Maven Central as
  of 2026-07-28 — consumers build them from the repository. Everything else on
  npm/PyPI that references the FAA (aviation-mcp, @squawk/notams, @aeyrium/faa-parser,
  faa-nms-api, @pipeworx/mcp-faa-delays) is third-party and is NOT recorded here.
