source_note: >-
  Fetched anonymously from the FAA's Gravitee APIM developer-portal REST API on
  2026-07-28 (HTTP 200 for all five APIs). These are the FAA's own published
  subscription plans, not an inference.
summary: >-
  Every FAA API is free. There is no paid tier, no metered billing and no
  commercial plan anywhere in the FAA estate — the agency is a US federal
  regulator publishing public data, and the two flagship open APIs carry a
  Creative Commons Zero (CC0) licence in their OpenAPI. What the portal DOES
  publish is a real subscription model: two APIs run a KEY_LESS plan (call them
  with no credential at all) and three run an API_KEY plan whose subscription
  requires MANUAL approval by the FAA API owner. So the gate is eligibility and
  approval, never money.
