gaps:
- No published API deprecation policy document and no Sunset/Deprecation header support.
- No SLA or uptime commitment for any API.
- No incident/uptime status page for any API.
- No consistent versioning scheme; four APIs use four different approaches.
- >-
  The single largest planned breaking change — the domestic-to-ICAO NOTAM format
  change — has no announced date.
