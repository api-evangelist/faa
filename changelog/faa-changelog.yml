announced_changes:
- date: '2026-07-28'
  source: https://nms.aim.faa.gov/
  kind: breaking
  title: NOTAM Management Service (NMS) replaces the USNS and FNS legacy systems
  detail: >-
    "The FAA is replacing the current United States NOTAM System (USNS) and Federal
    NOTAM System (FNS) legacy systems with a new, vendor-provided service in early
    FY2026. NOTAM Management Service (NMS) will become an authoritative source on
    September 30; it becomes the authoritative source once both the USNS and FNS
    transitions are completed in Spring 2026." All users are expected to have
    transitioned to originating NOTAMs in NMS in Spring 2026.
