overlay: 1.0.0
info:
  title: API Evangelist enhancements for FAA Safety Assurance System (SAS) API
  version: 1.0.0
x-generated: '2026-07-28'
x-method: generated
x-source: openapi/faa-safety-assurance-system-api-openapi.yml
x-note: >-
  Non-destructive enhancements only. The harvested FAA spec is never mutated. The
  most important thing this overlay adds is a real server URL — the spec ships
