      not be authorized."
    x-plan:
      name: API Key Plan
      security: API_KEY
      validation: MANUAL
      comment_required: true
    x-rate-limit:
      limit: 1
      period: 10 seconds
      scope: per subscription
      source: FAA Gravitee portal plan usage_configuration
    x-pii: true
