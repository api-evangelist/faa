    x-agentic-access:
      action-class: acting
      consequence: write
      audit: required
      human-in-the-loop: required
    x-idempotency: >-
      NONE. No idempotency key is accepted. A retry after a timeout may create
      duplicate pilot records with no documented de-duplication.
    x-missing-error-responses: >-
      Only 200 is declared. No 400, 401, 403, 429 or 5xx contract exists for a write
      operation carrying regulated pilot records.
