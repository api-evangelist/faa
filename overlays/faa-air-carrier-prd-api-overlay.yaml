      Carries pilot identity, employment, training, drug/alcohol and disciplinary
      records.
- target: $.components.securitySchemes
  update:
    clientId:
      type: apiKey
      in: header
      name: client_id
      description: >-
        RECOMMENDED. The spec declares client_id as a required header PARAMETER on
        every operation rather than as a security scheme, so generated clients treat
        the credential as an ordinary parameter and no tooling recognises this API as
        authenticated. Modelling it as a scheme fixes that.
    clientSecret:
      type: apiKey
      in: header
      name: client_secret
      description: >-
        RECOMMENDED. Same issue as client_id. Note that carrying a secret as a plain
        request header with no token exchange is the weakest credential model in the
        FAA estate, and it guards the most sensitive data in it.
- target: $.paths['/AirCarrierApi/Pilot'].post
