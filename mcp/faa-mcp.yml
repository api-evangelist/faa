notes:
- Every tool above inherits its real input contract from the referenced operation's parameters in the
  OpenAPI — no input schema was invented.
- Both source APIs are Creative Commons Zero (CC0) and answer unauthenticated, so a server built from
  this manifest needs no credential handling.
