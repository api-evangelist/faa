summary: >-
  Only two of the four FAA specs carry a usable schema graph. The Airport Status Web
  Service declares 11 components.schemas with real $ref links, and the SAS API
  declares a four-level nested submission document. The Air Carrier PRD API declares
  four schemas that are all EMPTY objects (`pilotData_example: {}`), so its real data
  model is visible only in the response `example` blocks — those examples are the
  only source for the PRD entity graph and are recorded as such below. The Aeronautic
  Product Release API declares no components at all: all 34 operations return
  `content: {}` and the actual payload is XML in the FAA-proprietary namespace
  http://arpa.ait.faa.gov/arpa_response, so its model is derived from operation
  semantics rather than from schemas.
  There is no shared identifier scheme across the four APIs — the FAA's join keys are
  industry identifiers (IATA/ICAO codes, N-Numbers, airman certificate numbers,
  ARTCC ids), not FAA-issued object ids with prefixes.
entities:
