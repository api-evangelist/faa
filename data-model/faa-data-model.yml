  required: [ReporterName, AirCarrierName, ReporterEmail, ReporterDSGN, Discrepancies]
  note: The submission envelope. One reporter, one air carrier, many discrepancies.
- name: Discrepancy
  api: FAA Safety Assurance System (SAS) API
  schema: openapi/faa-safety-assurance-system-api-openapi.yml#/components/schemas/Discrepancy
  required: [HazmatItems]
  identifier: CarrierRecordId
  identifier_note: Carrier-supplied record id — the carrier's key, not an FAA-issued one.
  fields: [AirCarrierDSGN, FlightOperatedByDSGN, CarrierRecordId, AirportCode, LocationOfDiscovery, DiscrepancyDate, PnrLocator, PassengerFullName, PassengerAddress, PassengerCity, PassengerStateCode, PassengerZipCode, PassengerCountryCode, PassengerPhone, PassengerEmail, FlightNumber, DestinationAirportCode]
  pii: true
  pii_note: >-
    Carries passenger name, postal address, phone, email and PNR locator. This is the
    most PII-dense schema in the FAA public estate and it is submitted over an
    apiKey-header API with no idempotency contract.
