    IATA three-letter code is both the path parameter and the natural key. The ICAO
    four-letter code is carried alongside it.
  fields: [name, city, state, icao, iata, supportedAirport, delay, delayCount, status, weather]
- name: Status
  api: FAA Airport Status Web Service
  schema: openapi/faa-airport-status-web-service-openapi.yml#/components/schemas/Status
